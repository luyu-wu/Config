 general {
    gaps_in = 4
    gaps_out = 16
    gaps_workspaces = 20

    border_size = 2
    col.active_border = rgb(A0A0A0)
    col.inactive_border = rgb(C0C0C0)
    
    layout = dwindle

    allow_tearing = true
}

input {  
  touchpad {
  	scroll_factor = 0.1
  	clickfinger_behavior = true
  	disable_while_typing = false
  	tap-and-drag = true
    natural_scroll = true
  }
  tablet {
  	#active_area_size = 48 27
  }

  sensitivity = 0.4
  accel_profile = flat
  repeat_rate = 50
  force_no_accel = true
  repeat_delay = 200

	# Focus Stuff
  follow_mouse = 1
}

cursor {
	enable_hyprcursor = false
	inactive_timeout = 0
}
gestures {
  workspace_swipe = on
  workspace_swipe_distance = 800
  workspace_swipe_min_speed_to_force = 40
  workspace_swipe_cancel_ratio = 0.1
  workspace_swipe_min_fingers = 3 
  workspace_swipe_direction_lock = false
}

dwindle {
  pseudotile = true
  preserve_split = true
}

binds {
	scroll_event_delay = 0
}

render {
	explicit_sync = 1
	direct_scanout = true
}
misc {	
	disable_splash_rendering = true
	disable_hyprland_logo = true
	force_default_wallpaper = 0
	disable_autoreload = true
	allow_session_lock_restore = true
	new_window_takes_over_fullscreen = 2
	render_ahead_of_time = false
	render_ahead_safezone = 0
	focus_on_activate = true
	animate_manual_resizes = false
	vrr = 1
	initial_workspace_tracking = 0
	middle_click_paste = false
}

xwayland {
	enabled = false
	force_zero_scaling = true
	use_nearest_neighbor = true
}

opengl {
	force_introspection = 2
	nvidia_anti_flicker = false
}

debug {
	overlay = false
	watchdog_timeout = 0
	disable_logs = false
}

decoration {
  rounding = 8

  shadow {
  	enabled = true
  	range = 20
  	render_power = 3
  	color = rgba(00000020)
  	color_inactive = rgba(00000015)
  	
  }
  dim_inactive = false
  dim_strength = 0
  dim_special = 0.8


  #screen_shader = ~/Code/Config/hypr/Shaders/vibrance.glsl
  #screen_shader = ~/Code/Config/hypr/Shaders/night.glsl
  #screen_shader = ~/Code/Config/hypr/Shaders/invert.frag
  #screen_shader = ~/Code/Config/hypr/Shaders/drugs.frag
  #screen_shader = ~/Code/Config/hypr/Shaders/chromatic_abberation.frag
  #screen_shader = ~/Code/Config/hypr/Shaders/solarized.frag
  #screen_shader = ~/Code/Config/hypr/Shaders/crt.frag

  #screen_shader = ~/Code/Config/hypr/Shaders/grayscale.glsl
  
  blur {
    enabled = false
   	special = false
	popups = true
	xray = false
    ignore_opacity = false
    size = 8
    passes = 3
    contrast = 0.8
    brightness = 1.5
    vibrancy = 0
    noise = 0.025
  }
}
animations {
	enabled = true
	first_launch_animation = false
}
