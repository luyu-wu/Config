[window]
width = 500
height = 900
anchor = "left"
margin_top = 0
margin_bottom = 0
margin_left = 30
margin_right = 0
show_descriptions = true
show_paths = false
show_icons = true
show_search = true
show_actions = false
show_border = true
border_width = 2
use_gtk_colors = false
use_custom_css = false
max_entries = 50

[window.custom_navigate_keys]
up = "k"
down = "j"
delete_word = "h"

[theme.colors]
window_bg = "#EBEBEB"
search_bg = "#D2D2D2"
search_bg_focused = "#282828"
item_bg = "#EBEBEB"
item_bg_hover = "#D2D2D2"
item_bg_selected = "#D2D2D2"
search_text = "#383838"
search_caret = "#808080"
item_name = "#383838"
item_name_selected = "#383838"
item_description = "#a0a0a0"
item_description_selected = "#a0a0a0"
item_path = "#808080"
item_path_selected = "#808080"
border = "#A0A0A0"

[theme.corners]
window = 12
search = 8
list_item = 8

[theme.spacing]
search_margin = 12
search_padding = 12
item_margin = 6
item_padding = 4

[theme.typography]
search_font_size = 16
item_name_size = 14
item_description_size = 12
item_path_size = 12
item_path_font_family = "monospace"

[debug]
disable_auto_focus = false
enable_logging = false

[dmenu]
allow_invalid = false
case_sensitive = false

[web_search]
enabled = true
engine = "google"

[[web_search.prefixes]]
prefix = "ai"
url = "https://claude.ai/new?q="


[[web_search.prefixes]]
prefix = "yt"
url = "https://www.youtube.com/results?search_query="

[[web_search.prefixes]]
prefix = "gh"
url = "https://github.com/search?q="

[calculator]
enabled = true
