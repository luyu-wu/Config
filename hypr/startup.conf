env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = TERMINAL, alacritty
env = QT_QPA_PLATFORMTHEME,kde

# Chinese
#env = LANGUAGE,zh_CN:en_US
#env = LANG,zh_CN.UTF-8
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = QT_LOGGING_RULES="*.debug=false"
env = XDG_MENU_PREFIX,arch-

exec-once=dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP
exec = systemctl --user start plasma-polkit-agent

exec-once = fcitx5
exec-once = dunst
exec-once = hyprpaper
exec-once = waybar
exec = hyprctl dispatch submap normal
exec-once = hyprpm reload
