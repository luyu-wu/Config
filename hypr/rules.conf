# LAYER RULES

layerrule {
  name = No Anims
  no_anim = on
  match:namespace = hyprpicker|selection|hyprpaper
}

layerrule {
  name = Popin
  animation = popin
  match:namespace = ch.wysbd.hyprland-preview-screen-picker
}

layerrule {
  name = Enable Blur
  blur = on
  ignore_alpha = 0.5
  match:namespace = wofi|krunner|notifications$
}

layerrule {
  name = Layer2
  blur = on
  ignore_alpha = 0.5
  no_anim = true
  match:namespace = quickshell|swaync-notification-window$
}
layerrule {
	name = Cairo
	blur = on
	ignore_alpha = 0.3
	match:namespace = cairo-dock-_MainDock_
}
layerrule {
  name = SwayNC-Center
  blur = on
  ignore_alpha = 0.5
  animation = slide top
  match:namespace = swaync-control-center|swayosd$
}
layerrule {
	name = QS-Expose
	# blur = on
	# no_anim = true
	animation = popin
	dim_around = true
	match:namespace = quickshell:expose
}


# WINDOW RULES
windowrule {
  name = All Windows
  suppress_event = maximize
  no_blur = on
  match:class = .*$
}

windowrule {
  name = Float Windows
  float = on
  match:class = xdg-desktop-portal-gtk|io.bassi.Amberol|python3|org.gnome.Loupe|com.github.huluti.Curtail|dev.bragefuglseth.Fretboard|eww|com.github.GradienceTeam.Gradience|pavucontrol|blueman-manager|nm-connection-editor|blueberry.py|Color Picker|Network|xdg-desktop-portal|xdg-desktop-portal-hyprland|xdg-desktop-portal-gnome|io.github.nate_xyz.Chromatic|it.mijorus.whisper|io.github.giantpinkrobots.flatsweep|VirtualBox Machine|org.gnome.Nautilus|floatterm|moe.launcher.an-anime-game-launcher|org.gnome.clocks|org.gnome.Calculator|io.github.kaii_lb.Overskride|org.matplotlib.Matplotlib3|org.gnome.Decibels|org.kde.dolphin|org.kde.gwenviewsudo|io.github.nokse22.trivia-quiz|com.saivert.pwvucontrol|io.missioncenter.MissionCenter|org.kde.plasmashell|pavucontrol-qt|hu.irl.cameractrls|org.freedesktop.impl.portal.desktop.kde|mpv|org.kde.plasmashell|org.fooyin.fooyin|zoom|spotify|Spotify
}

windowrule {
  name = File Manager Size
  size = (monitor_w*0.4) (monitor_h*0.4)
  match:class = org.gnome.Nautilus|org.kde.dolphin
}

windowrule {
  name = Popups
  stay_focused = on
  match:title = Save Image|New Layer|Rotate View|polkit-gnome-authentication-agent-1
}

windowrule {
  name = KCM Controls
  stay_focused = on
  hyprbars:no_bar = true
  size = (400) (600)
  pin = on
  animation = slide top
  float = on
  move = (monitor_w-500) (50)
  rounding = 24
  match:class = (kcm)(.*)|pavucontrol-qt
}

windowrule {
  name = Firefox PiP
  float = on
  size = (monitor_w*0.25) (monitor_h*0.25)
  move = ((monitor_w*0.743)) ((monitor_h*0.035))
  pin = on
  match:title = Picture-in-Picture
}


windowrule {
  name = Faster Touchpad
  scroll_touchpad = 0.3
  match:class = dev.zed.Zed|org.gnome.Papers|wechat|com.github.flxzt.rnote
}

windowrule {
  name = Slower Touchpad
  scroll_touchpad = 0.06
  match:class = thorium-browser|vesktop|spotify

}

windowrule {
  name = Foot Terminal
  scroll_touchpad = 0.5
  hyprbars:no_bar = false
  hyprbars:bar_color = rgb(333333)
  hyprbars:title_color = rgb(E0E0E0)
  border_color=0xff505050
  move = ((cursor_x-window_w*0.5)) ((cursor_y-window_h*0.2))
  match:class = foot
}

windowrule {
  name = Fusion
  hyprbars:bar_color = rgb(d9d9d9)
  match:class = fusion360.exe
}
windowrule {
  name = Thorium
  hyprbars:bar_color = rgb(d3e3fd)
  match:focus = true

  match:class = thorium-browser 
}
windowrule {
  name = Thorium Unfocused
  hyprbars:bar_color = rgb(dde3e9)
  match:focus = false
  match:class = thorium-browser 
}

windowrule {
  name = Libadwaita
  hyprbars:bar_color = rgb(ffffff)
  hyprbars:title_color = rgb(ffffff)
  match:focus = true
  match:class = com.github.flxzt.rnote|io.github.vani_tty1.memerist
}

windowrule {
  name = Libadwaita-Unfocus
  hyprbars:bar_color = rgb(fafafb)
  hyprbars:title_color = rgb(fafafa)
  match:focus = false
  match:class = com.github.flxzt.rnote|io.github.vani_tty1.memerist
}
windowrule {
  name = Breeze Dark
  hyprbars:bar_color = rgb(292d31)
  hyprbars:title_color = rgb(E0E0E0)
  match:focus = true
  match:class = org.kde.kdenlive
}

windowrule {
  name = Breeze Dark-Unfocus
  hyprbars:bar_color = rgb(212429)
  hyprbars:title_color = rgb(A0A0A0)
  match:focus = false
  match:class = org.kde.kdenlive
}

windowrule {
  name = Teams
  hyprbars:bar_color = rgb(eaeaea)
  match:class = teams-for-linux 
}

windowrule {
  name = OBS
  hyprbars:bar_color = rgb(212121)
  hyprbars:title_color = rgb(E0E0E0)
  match:class = com.obsproject.Studio 
}
windowrule {
  name = GIMP
  hyprbars:bar_color = rgb(3c3c3c)
  hyprbars:title_color = rgb(E0E0E0)
  match:class = gimp 
}

windowrule {
  name = Spotify
  hyprbars:bar_color = rgb(000000)
  hyprbars:title_color = rgb(E0E0E0)
  match:class = Spotify|spotify
}

windowrule {
	name = WeChat
	hyprbars:no_bar = true
	no_anim = true
	decorate = false
	match:class = wechat
}
windowrule {
	name = Zoom
	hyprbars:bar_color = rgb(dfe3e8)
	match:class = zoom
}
windowrule {
	name = Zoom Meeting
	hyprbars:bar_color = rgb(2a2b2d)
	hyprbars:title_color = rgb(2a2b2d)
	match:class = zoom
	match:title = Meeting
}
windowrule {
	name = Zoom Share
	pin = true
	decorate = false
	no_anim = true
	hyprbars:no_bar = true
	match:class = zoom
	match:title = zoom_linux_float_video_window|as_toolbar|annotate_toolbar|ZoomAnnoArrowWindow|Annotation - Zoom|Presenter layout
}

windowrule {
	name = Unfocused Bar Color
	hyprbars:bar_color = rgb(eff0f1)
	hyprbars:title_color = rgb(808080)
	match:focus = false
	match:class = negative:vesktop|foot|floatterm|fusion360.exe|thorium-browser|dev.zed.Zed|spotify|com.github.flxzt.rnote|teams-for-linux|com.obsproject.Studio|org.kde.kdenlive|gimp|io.github.vani_tty1.memerist|zoom|Spotify
}

windowrule {
	name = Pinned
	hyprbars:no_bar = true
	match:pin = true
}
windowrule {
	name = Fake Fullscreen
	hyprbars:no_bar = true
	match:fullscreen_state_client=3
}

windowrule {
  name = Fullscreen
  fullscreen = on
  match:class = osu!|dev.zed.Zed|SiYuan|virt-viewer|com.obsproject.Studio
}

windowrule {
  name = Fooyin Size
  size = 708 645
  keep_aspect_ratio = true
  match:class = org.fooyin.fooyin$
}


# SPECIAL WORKSPACES
windowrule {
  name = Zed
  workspace = special:code
  hyprbars:bar_color = rgb(4d4844)
  hyprbars:title_color = rgb(F0F0F0)
  match:class = dev.zed.Zed
}

windowrule {
  name = Discord
  workspace = special:discord
  hyprbars:bar_color = rgb(19191b)
  hyprbars:title_color = rgb(E0E0E0)
  match:class = vesktop
}

windowrule {
  name = Creative
  workspace = special:kden
  match:class = org.kde.kdenlive|org.freecad.FreeCAD|org.shotcut.Shotcut
}

windowrule {
  name = Games
  workspace = special:game
  match:class = genshinimpact.exe|osu!|moe.launcher.an-anime-game-launcher|osgViewer|org.vinegarhq.Sober|(Minecraft)(.*)
}

windowrule {
  name = VM Windows
  workspace = special:windows
  match:class = virt-viewer|com.moonlight_stream.Moonlight
}

windowrule {
  name = OBS
  workspace = special:obs
  match:class = com.obsproject.Studio
}

workspace =, layout:dwindle
workspace=special:code,		on-created-empty:	zeditor
workspace=special:discord, 	on-created-empty: 	vesktop --enable-ozone-platform=wayland  --enable-wayland-ime
workspace=special:obs,	 	on-created-empty: 	obs
workspace=special:windows,  on-created-empty: moonlight stream Chrysanthemum "Desktop"
