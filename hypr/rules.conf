# Window Rules
windowrule = float, ^(xdg-desktop-portal-gtk|io.bassi.Amberol|python3|org.gnome.Loupe|com.github.huluti.Curtail|dev.bragefuglseth.Fretboard|eww|com.github.GradienceTeam.Gradience|pavucontrol|blueman-manager|nm-connection-editor|blueberry.py|Color Picker|Network|xdg-desktop-portal|xdg-desktop-portal-hyprland|xdg-desktop-portal-gnome|io.github.nate_xyz.Chromatic|it.mijorus.whisper|io.github.giantpinkrobots.flatsweep|VirtualBox Machine|org.gnome.Nautilus|floatterm|moe.launcher.an-anime-game-launcher|org.gnome.clocks|org.gnome.Calculator|io.github.kaii_lb.Overskride|org.matplotlib.Matplotlib3|org.gnome.Decibels|org.kde.dolphin|org.kde.gwenviewsudo|io.github.nokse22.trivia-quiz|com.saivert.pwvucontrol|io.missioncenter.MissionCenter|com.jeffser.Alpaca|org.kde.plasmashell|pavucontrol-qt|hu.irl.cameractrls)$
windowrule = suppressevent maximize, ^(.*)$ 
windowrule = size 55% 50%, ^(org.gnome.Nautilus|org.kde.dolphin)


windowrule = center, ^(org.gnome.Nautilus|org.kde.dolphin)

windowrule = stayfocused, title:^(Save Image|New Layer|Rotate View|polkit-gnome-authentication-agent-1)$

windowrule = float, title:^(Picture-in-Picture|画中画)$
windowrule = size 30% 30%, title:^(Picture-in-Picture|画中画)$
windowrule = move 69.3% 69%, title:^(Picture-in-Picture|画中画)$
windowrule = nodim, title:^(Picture-in-Picture)$ 
windowrule = pin, title:^(Picture-in-Picture)$

#windowrulev2 = rounding 8,floating:1
windowrulev2 = renderunfocused,class:^(looking-glass-client)$

# Layer Rules
layerrule = ignorezero, rofi$
layerrule = blur, rofi$
layerrule = blur, waybar$
layerrule = blur, notifications$
layerrule = blur, gtk4-layer-shell$
layerrule = blur, hyprlauncher$


layerrule = animation slide, notifications$
layerrule = animation slide, rofi$
layerrule = animation none,  selection$
layerrule = animation none, hyprpicker$


# Workspace Rules
windowrule = workspace special:discord, ^(vesktop)$
windowrule = workspace special:spotify, 	^(Spotify)$
windowrule = workspace special:code, ^(dev.zed.Zed)$
windowrule = workspace special:windows, ^(Waydroid|looking-glass-client)$
windowrule = workspace special:kden, ^(org.kde.kdenlive)$
windowrule = workspace special:game, ^(genshinimpact.exe|osu!|moe.launcher.an-anime-game-launcher)$
windowrule = workspace special:game, title:(Minecraft)(.*)$
windowrulev2 = workspace special:game, initialClass:(osu!)$
windowrule = workspace special:obs, ^(com.obsproject.Studio)$

windowrule = fullscreen, ^(Waydroid|looking-glass-client)$

workspace=special:windows, 	on-created-empty:	looking-glass-client
workspace=special:discord, 	on-created-empty: 	vesktop --ozone-platform=wayland  --enable-wayland-ime
workspace=special:spotify, 	on-created-empty: 	spotify-launcher --skip-update
#workspace=special:kden, 	on-created-empty: 	kdenlive
workspace=special:obs,	 	on-created-empty: 	obs
workspace=special:code, 	on-created-empty:	zeditor
