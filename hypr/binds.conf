# Function Keys
submap = normal
bindle = , XF86MonBrightnessUp,     exec, brightnessctl s +5%
bindle = , XF86MonBrightnessDown,   exec, brightnessctl s 5%-
bindle =SHIFT , XF86MonBrightnessUp,     exec, brightnessctl s +1%
bindle =SHIFT , XF86MonBrightnessDown,   exec, brightnessctl s 1%-

bindle = SUPER, XF86MonBrightnessDown,   exec, brightnessctl s 1
#bindle = SUPER, XF86MonBrightnessDown, exec, pkill dimland || dimland -a 0.5 -r 5

bindel=, XF86AudioRaiseVolume, exec, pactl set-sink-volume 0 +5%
bindel=, XF86AudioLowerVolume, exec, pactl set-sink-volume 0 -5%
bindel=SHIFT, XF86AudioRaiseVolume, exec, pactl set-sink-volume 0 +1%
bindel=SHIFT, XF86AudioLowerVolume, exec, pactl set-sink-volume 0 -1%

bindl=, XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl=, XF86PowerOff, exec, pkill wleave || wleave -m 500 -c 50 -f
bindl= SHIFT , XF86PowerOff, exec, systemctl suspend
bind  = , XF86AudioPlay, exec, playerctl play-pause
bind  = , XF86AudioPrev, exec, playerctl previous
bind  = , XF86AudioNext, exec, playerctl next
bind  =	,XF86AudioMedia, exec, foot -D ~/Code/Config
bind =	SHIFT,XF86AudioMedia, exec, foot -a floatterm -D ~/Code/Config

# Screenshotting
bind = SUPER SHIFT, C, exec, hyprpicker -a
bindl = ,Print, exec, grimshot copy screen
bind = ,Print, exec, notify-send "Screenshot Taken" "Copied to clipboard."
bindp = SUPER SHIFT, S, exec, grimshot copy area
bind = SHIFT,Print, exec, grimshot savecopy screen
bind = SUPER, A, execr, grimshot save area - | tesseract stdin stdout | wl-copy
bind = SUPER SHIFT, A, execr, grimshot save area - | tesseract stdin stdout -l chi_sim | wl-copy

bind = SHIFT ,Print, exec, notify-send "Screenshot Taken" "Saved to ~/Pictures/"

# Global Keybinds
bindn = ,F2,pass,^(com\.obsproject\.Studio)$

# Plugins
# bind = SUPER, Tab, overview:toggle 

# Launchers
#bind = SUPER, R, exec, pkill rofi || rofi -show drun
bind = SUPER, R, exec, hyprlauncher
bind = SUPER, M, exec, pkill hyprsunset || hyprsunset -t 3000
bind = SUPER SHIFT, M, exec, pkill hyprsunset || hyprsunset -t 2000

bind = SUPER, W, exec, firefox
bind = SUPER, O, exec, osu-lazer
bind = SUPER, I, exec, systemsettings
bind = SUPER SHIFT, I, invertactivewindow
bind = SUPER, P, exec, foot -D ~/Code/Config/hypr -e micro monitors.conf
bind = SUPER, E, exec, dolphin
bind = SUPER, T, exec, foot
bind = CTRL SHIFT, escape, exec, foot -a floatterm -e btop
bind = SUPER SHIFT, T, exec, foot -a floatterm
bind = SUPER SHIFT, L, exec, hyprlock

# Special Workspace
bind = SUPER , D, 	togglespecialworkspace, discord
bind = SUPER , S, 	togglespecialworkspace, spotify
bind = SUPER , C, togglespecialworkspace, code
bind = SUPER , X, 	togglespecialworkspace, obs
bind = SUPER , N, 	togglespecialworkspace, note
bind = SUPER , G, 	togglespecialworkspace, game
bind = SUPER SHIFT, G, 	movetoworkspace, special:game
bind = SUPER SHIFT, K, 	togglespecialworkspace, kden
bind=SUPER SHIFT, X, exec, notify-send "关 BINDS" "入Windows VM, 关掉Binds"
bind = SUPER SHIFT, X, togglespecialworkspace, windows
bind = SUPER SHIFT, X, submap, vm

# Reload
bind = CTRL SHIFT, delete, exec, hyprctl reload
bind = CTRL SHIFT, delete, exec, notify-send "Reload Hyprland" "Hyprland Configuration Reloaded

#bind = SUPER SHIFT, delete, exec, hyprctl keyword monitor "eDP-1, disable"
bind = SUPER SHIFT, delete, exec, notify-send "Disable Monitor" "关掉了eDP-1"

bind = SUPER SHIFT, XF86AudioMedia, exec, hyprctl keyword decoration:shadow:enabled false
bind = SUPER SHIFT, XF86AudioMedia, exec, hyprctl keyword decoration:blur:enabled false
bind = SUPER SHIFT, XF86AudioMedia, exec, hyprctl keyword animations:enabled false
bind = SUPER SHIFT, XF86AudioMedia, exec, notify-send "Power Saving Mode" "省电模式开了"

# Bindings
bind = SUPER, Q, killactive
bind = SUPER, V, togglefloating
bind = SUPER, F, fullscreenstate, 3
bind = SUPER SHIFT, F, fullscreenstate, 0 3
bind = SUPER, J, togglesplit
bind = SUPER SHIFT, P, pin

# Move focus with mainMod + arrow keys
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER, right, movefocus, r
bind = SUPER, left, movefocus, l

bind = SUPER, up, bringactivetotop
bind = SUPER, down, bringactivetotop
bind = SUPER, right, bringactivetotop
bind = SUPER, left, bringactivetotop

# Move workspaces with mouse wheel
bindp=SUPER,mouse_up,exec, hyprnome
bindp=SUPER,mouse_down,exec, hyprnome --previous

bind=SUPER SHIFT,mouse:273, movetoworkspace, empty

bind = SUPER, 1, exec, hyprnome --previous
bind = SUPER, 2, exec, hyprnome
bind = SUPER_SHIFT, 1, exec, hyprnome --previous --move
bind = SUPER_SHIFT, 2, exec, hyprnome --move

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER SHIFT, mouse:272, resizewindow

# sets repeatable binds for resizing the active window
bind=SUPER SHIFT,right,resizeactive,100 0
bind=SUPER SHIFT,left,resizeactive,-100 0
bind=SUPER SHIFT,up,resizeactive,0 -100
bind=SUPER SHIFT,down,resizeactive,0 100



# VM Workspace
submap=vm

bindp = SUPER SHIFT, X, togglespecialworkspace, windows
bindp = SUPER SHIFT, X, exec, notify-send "开 BINDS" "出Windows VM, 开Binds"
bindp = SUPER SHIFT,X,submap,normal
bindep=, XF86AudioRaiseVolume, exec, pactl set-sink-volume 0 +5%
bindep=, XF86AudioLowerVolume, exec, pactl set-sink-volume 0 -5%
bindp=, XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindp = SUPER SHIFT, S, exec, grimshot copy area

bindp = SUPER , D, 	togglespecialworkspace, discord
bindp=SUPER, D, exec, notify-send "开 BINDS" "出Windows VM, 开Binds"
bindp=SUPER,D,submap,normal

bindp = SUPER , S, 	togglespecialworkspace, spotify
bindp=SUPER, S, exec, notify-send "开 BINDS" "出Windows VM, 开Binds"
bindp=SUPER,S,submap,normal
