# Window Rules
windowrule {
  name = windowrule-1
  float = on
  match:class = ^(xdg-desktop-portal-gtk|io.bassi.Amberol|python3|org.gnome.Loupe|com.github.huluti.Curtail|dev.bragefuglseth.Fretboard|eww|com.github.GradienceTeam.Gradience|pavucontrol|blueman-manager|nm-connection-editor|blueberry.py|Color Picker|Network|xdg-desktop-portal|xdg-desktop-portal-hyprland|xdg-desktop-portal-gnome|io.github.nate_xyz.Chromatic|it.mijorus.whisper|io.github.giantpinkrobots.flatsweep|VirtualBox Machine|org.gnome.Nautilus|floatterm|moe.launcher.an-anime-game-launcher|org.gnome.clocks|org.gnome.Calculator|io.github.kaii_lb.Overskride|org.matplotlib.Matplotlib3|org.gnome.Decibels|org.kde.dolphin|org.kde.gwenviewsudo|io.github.nokse22.trivia-quiz|com.saivert.pwvucontrol|io.missioncenter.MissionCenter|com.jeffser.Alpaca|org.kde.plasmashell|pavucontrol-qt|hu.irl.cameractrls|org.freedesktop.impl.portal.desktop.kde|mpv|org.kde.plasmashell)$
}

windowrule {
  name = windowrule-2
  suppress_event = maximize
  float = on
  match:class = .*$
}

 
windowrule {
  name = windowrule-3
  size = (monitor_w*0.55) (monitor_h*0.5)
  center = on
  match:class = ^(org.gnome.Nautilus|org.kde.dolphin)
}



windowrule {
  name = windowrule-4
  stay_focused = on
  match:title = ^(Save Image|New Layer|Rotate View|polkit-gnome-authentication-agent-1)$
}



windowrule {
  name = windowrule-5
  float = on
  size = (monitor_w*0.3) (monitor_h*0.3)
  move = ((monitor_w*0.693)) ((monitor_h*0.69))
  pin = on
  match:title = Picture-in-Picture$
}


windowrule {
  name = windowrule-6
  no_anim = on
  float = on
  match:class = wleave
}


# Layer Rules
layerrule {
  name = layerrule-1
  no_anim = on
  match:namespace = selection$
}

layerrule {
  name = layerrule-2
  no_anim = on
  match:namespace = hyprpicker$
}

layerrule {
  name = layerrule-3
  animation = popin
  match:namespace = ch.wysbd.hyprland-preview-screen-picker$
}

layerrule {
  name = layerrule-4
  blur = on
  match:namespace = waybar$
}

layerrule {
  name = layerrule-5
  blur = on
  ignore_alpha = 0
  match:namespace = krunner$
}

# Touchpad Speeds
windowrule {
  name = windowrule-7
  scroll_touchpad = 0.3
  match:class = ^(dev.zed.Zed|org.gnome.Papers|wechat|com.github.flxzt.rnote)$
}

windowrule {
  name = windowrule-8
  scroll_touchpad = 0.5
  match:class = ^(foot|floatterm)$
}




# Workspace Rules
workspace = w[tv1], gapsout:128

windowrule {
  name = windowrule-9
  workspace = special:discord
  match:class = vesktop
}

windowrule {
  name = windowrule-10
  workspace = special:spotify
  match:class = ^(Spotify|org.kde.elisa)$
}

windowrule {
  name = windowrule-11
  workspace = special:code
  match:class = dev.zed.Zed
}

windowrule {
  name = windowrule-12
  workspace = special:kden
  match:class = ^(org.kde.kdenlive|org.freecad.FreeCAD|org.shotcut.Shotcut)$
}

windowrule {
  name = windowrule-13
  workspace = special:game
  match:class = ^(genshinimpact.exe|osu!|moe.launcher.an-anime-game-launcher|osgViewer|org.vinegarhq.Sober)$
}

windowrule {
  name = windowrule-14
  workspace = special:game
  match:title = (Minecraft)(.*)$
}

windowrule {
  name = windowrule-15
  workspace = special:windows
  match:class = virt-viewer
}

windowrule {
  name = windowrule-16
  workspace = special:obs
  match:class = com.obsproject.Studio
}

windowrule {
  name = windowrule-17
  workspace = special:note
  match:class = SiYuan
}


windowrule {
  name = windowrule-18
  fullscreen = on
  match:class = ^(osu!|dev.zed.Zed|SiYuan|virt-viewer)$
}


workspace=special:code,		on-created-empty:	zeditor

workspace=special:discord, 	on-created-empty: 	vesktop --enable-ozone-platform=wayland  --enable-wayland-ime
workspace=special:spotify, 	on-created-empty: 	spotify-launcher --skip-update
#workspace=special:kden, 	on-created-empty: 	kdenlive
workspace=special:obs,	 	on-created-empty: 	obs
workspace=special:note,		on-created-empty:	siyuan-note --enable-ozone-platform=wayland  --enable-wayland-ime
workspace=special:windows, on-created-empty: virt-viewer --connect qemu:///system --attach win11
