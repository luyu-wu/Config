env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,kde
env = GDK_BACKEND,wayland,x11,*
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = TERMINAL, foot
env = XDG_MENU_PREFIX,plasma-

# Chinese
# env = LANGUAGE,zh_CN:en_US
# env = LANG,zh_CN.UTF-8
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = QT_LOGGING_RULES="*.debug=false"

exec-once=dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP
exec-once = systemctl --user start plasma-polkit-agent

exec-once = fcitx5
exec-once = swaync
exec-once = hypridle
exec-once = hyprpaper
exec-once = cairo-dock
exec-once = waybar
# exec-once = bluetooth off
exec-once = hyprpm reload
exec = hyprctl dispatch submap normal
exec-once = qs-overview start
exec-once = hyprctl plugin load /home/chrysanthemum/Code/Config/hypr/Shaders/hyprselect.so

exec = play /home/chrysanthemum/.config/hypr/Assets/startup.mp3
