# WORKSPACE RULES

# workspace = w[tv1], gapsout:128 # Single workspace gaps

# LAYER RULES

layerrule {
  name = No Anims
  no_anim = on
  match:namespace = hyprpicker|selection$
}

layerrule {
  name = Popin
  animation = popin
  match:namespace = ch.wysbd.hyprland-preview-screen-picker$
}

layerrule {
  name = Enable Blur
  blur = on
  ignore_alpha = 0.5
  match:namespace = wofi|krunner|notifications$
}

layerrule {
  name = Quickshell
  blur = on
  ignore_alpha = 0.5
  no_anim = true
  match:namespace = quickshell$
}
layerrule {
	name = Cairo
	blur = on
	ignore_alpha = 0.3
	match:namespace = cairo-dock-_MainDock_
}
layerrule {
  name = SwayNC-Center
  blur = on
  ignore_alpha = 0.5
  animation = slide top
  match:namespace = swaync-control-center|swayosd$
}
layerrule {
  name = Notifs
  blur = on
  ignore_alpha = 0.5
  no_anim = true
  match:namespace = swaync-notification-window$
}


# WINDOW RULES

windowrule {
  name = windowrule-1
  float = on
  match:class = ^(xdg-desktop-portal-gtk|io.bassi.Amberol|python3|org.gnome.Loupe|com.github.huluti.Curtail|dev.bragefuglseth.Fretboard|eww|com.github.GradienceTeam.Gradience|pavucontrol|blueman-manager|nm-connection-editor|blueberry.py|Color Picker|Network|xdg-desktop-portal|xdg-desktop-portal-hyprland|xdg-desktop-portal-gnome|io.github.nate_xyz.Chromatic|it.mijorus.whisper|io.github.giantpinkrobots.flatsweep|VirtualBox Machine|org.gnome.Nautilus|floatterm|moe.launcher.an-anime-game-launcher|org.gnome.clocks|org.gnome.Calculator|io.github.kaii_lb.Overskride|org.matplotlib.Matplotlib3|org.gnome.Decibels|org.kde.dolphin|org.kde.gwenviewsudo|io.github.nokse22.trivia-quiz|com.saivert.pwvucontrol|io.missioncenter.MissionCenter|org.kde.plasmashell|pavucontrol-qt|hu.irl.cameractrls|org.freedesktop.impl.portal.desktop.kde|mpv|org.kde.plasmashell|org.fooyin.fooyin)$
}

windowrule {
  name = All Windows
  suppress_event = maximize
  float = on
  no_blur=true
  move = ((cursor_x-window_w*0.5)) ((cursor_y-window_h*0.2))
  #match:class = .*$
  match:class= foot
}

 
windowrule {
  name = windowrule-3
  size = (monitor_w*0.4) (monitor_h*0.4)
  match:class = ^(org.gnome.Nautilus|org.kde.dolphin|firefox)
}

windowrule {
  name = windowrule-4
  stay_focused = on
  match:title = ^(Save Image|New Layer|Rotate View|polkit-gnome-authentication-agent-1)$
}

windowrule {
  name = windowrule-5
  float = on
  size = (monitor_w*0.25) (monitor_h*0.25)
  move = ((monitor_w*0.743)) ((monitor_h*0.035))
  pin = on
  match:title = Picture-in-Picture$
}


windowrule {
  name = windowrule-7
  scroll_touchpad = 0.3
  match:class = ^(dev.zed.Zed|org.gnome.Papers|wechat|com.github.flxzt.rnote)$
}

windowrule {
	name = Dark Borders
	border_color=0xff505050
	match:class = foot
}

windowrule {
  name = Foot Terminal
  scroll_touchpad = 0.5
  hyprbars:no_bar = false
  hyprbars:bar_color = rgb(333333)
  hyprbars:title_color = rgb(E0E0E0)
  match:class = foot|floatterm$
}

windowrule {
  name = Fusion
  hyprbars:bar_color = rgb(d9d9d9)
  match:class = fusion360.exe
}
windowrule {
  name = Thorium
  hyprbars:bar_color = rgb(fadebb)
  match:class = thorium-browser 
}

windowrule {
	name = Unfocused Bar Color
	hyprbars:bar_color = rgb(eff0f1)
	hyprbars:title_color = rgb(808080)
	match:focus = false
	match:class = negative:vesktop|foot|floatterm|fusion360.exe|thorium-browser|dev.zed.Zed|spotify
}

windowrule {
	name = Pinned
	hyprbars:no_bar = true
	match:pin = true
}

windowrule {
  name = Fullscreen
  fullscreen = on
  match:class = ^(osu!|dev.zed.Zed|SiYuan|virt-viewer|com.obsproject.Studio)$
}

windowrule {
  name = Fooyin Size
  size = 708 645
  match:class = org.fooyin.fooyin$
}


# SPECIAL WORKSPACES
windowrule {
  name = Zed
  workspace = special:code
  hyprbars:bar_color = rgb(4d4844)
  hyprbars:title_color = rgb(F0F0F0)
  match:class = dev.zed.Zed
}

windowrule {
  name = Discord
  workspace = special:discord
  hyprbars:bar_color = rgb(19191b)
  hyprbars:title_color = rgb(E0E0E0)
  match:class = vesktop
}

windowrule {
  name = Spotify
  hyprbars:bar_color = rgb(000000)
  hyprbars:title_color = rgb(E0E0E0)
  match:class = spotify
}

windowrule {
  name = windowrule-12
  workspace = special:kden
  match:class = ^(org.kde.kdenlive|org.freecad.FreeCAD|org.shotcut.Shotcut)$
}

windowrule {
  name = windowrule-13
  workspace = special:game
  match:class = ^(genshinimpact.exe|osu!|moe.launcher.an-anime-game-launcher|osgViewer|org.vinegarhq.Sober)$
}

windowrule {
  name = windowrule-14
  workspace = special:game
  match:title = (Minecraft)(.*)$
}

windowrule {
  name = windowrule-15
  workspace = special:windows
  match:class = virt-viewer
}

windowrule {
  name = windowrule-16
  workspace = special:obs
  match:class = com.obsproject.Studio
}

windowrule {
  name = windowrule-17
  workspace = special:note
  match:class = SiYuan
}

workspace =, layout:dwindle
workspace=special:code,		on-created-empty:	zeditor
workspace=special:discord, 	on-created-empty: 	vesktop --enable-ozone-platform=wayland  --enable-wayland-ime
workspace=special:spotify, 	on-created-empty: 	spotify-launcher --skip-update
#workspace=special:kden, 	on-created-empty: 	kdenlive
workspace=special:obs,	 	on-created-empty: 	obs
workspace=special:note,		on-created-empty:	siyuan-note --enable-ozone-platform=wayland  --enable-wayland-ime
workspace=special:windows, on-created-empty: virt-viewer --connect qemu:///system --attach win11
