# Window Rules
windowrule = float, class:^(xdg-desktop-portal-gtk|io.bassi.Amberol|python3|org.gnome.Loupe|com.github.huluti.Curtail|dev.bragefuglseth.Fretboard|eww|com.github.GradienceTeam.Gradience|pavucontrol|blueman-manager|nm-connection-editor|blueberry.py|Color Picker|Network|xdg-desktop-portal|xdg-desktop-portal-hyprland|xdg-desktop-portal-gnome|io.github.nate_xyz.Chromatic|it.mijorus.whisper|io.github.giantpinkrobots.flatsweep|VirtualBox Machine|org.gnome.Nautilus|floatterm|moe.launcher.an-anime-game-launcher|org.gnome.clocks|org.gnome.Calculator|io.github.kaii_lb.Overskride|org.matplotlib.Matplotlib3|org.gnome.Decibels|org.kde.dolphin|org.kde.gwenviewsudo|io.github.nokse22.trivia-quiz|com.saivert.pwvucontrol|io.missioncenter.MissionCenter|com.jeffser.Alpaca|org.kde.plasmashell|pavucontrol-qt|hu.irl.cameractrls|vlc)$
windowrule = suppressevent maximize, class:^(.*)$ 
windowrule = size 55% 50%, class:^(org.gnome.Nautilus|org.kde.dolphin)


windowrule = center, class:^(org.gnome.Nautilus|org.kde.dolphin)

windowrule = stayfocused, title:^(Save Image|New Layer|Rotate View|polkit-gnome-authentication-agent-1)$

windowrule = float, title:^(Picture-in-Picture|画中画)$
windowrule = size 20% 20%, title:^(Picture-in-Picture|画中画)$
windowrule = move 79% 79%, title:^(Picture-in-Picture|画中画)$
windowrule = nodim, title:^(Picture-in-Picture)$ 
windowrule = pin, title:^(Picture-in-Picture)$

#windowrulev2 = rounding 8,floating:1
windowrule = renderunfocused,class:^(looking-glass-client|vlc)$

# Layer Rules
layerrule = ignorezero, rofi$
layerrule = blur, rofi$
layerrule = blur, waybar$
layerrule = blur, notifications$
layerrule = blur, gtk4-layer-shell$
layerrule = blur, hyprlauncher$


layerrule = animation slide, notifications$
layerrule = animation slide, rofi$
layerrule = noanim, selection$
layerrule = animation none, hyprpicker$


# Workspace Rules
windowrule = workspace special:discord, class:^(vesktop)$
windowrule = workspace special:spotify, 	class:^(Spotify)$
windowrule = workspace special:code, class:^(dev.zed.Zed)$
windowrule = workspace special:windows, class:^(Waydroid|looking-glass-client)$
windowrule = workspace special:kden, class:^(org.kde.kdenlive)$
windowrule = workspace special:game, class:^(genshinimpact.exe|osu!|moe.launcher.an-anime-game-launcher)$
windowrule = workspace special:game, title:(Minecraft)(.*)$
windowrule = workspace special:game, initialClass:(osu!)$
windowrule = workspace special:obs, class:^(com.obsproject.Studio)$

windowrule = fullscreen, class:^(Waydroid|looking-glass-client)$

workspace=special:windows, 	on-created-empty:	looking-glass-client
workspace=special:discord, 	on-created-empty: 	vesktop --ozone-platform=wayland  --enable-wayland-ime
workspace=special:spotify, 	on-created-empty: 	spotify-launcher --skip-update
#workspace=special:kden, 	on-created-empty: 	kdenlive
workspace=special:obs,	 	on-created-empty: 	obs
workspace=special:code, 	on-created-empty:	zeditor
