#bind = SUPER, tab, hyprtasking:toggle, all
#bind = SUPER, space, hyprtasking:toggle, cursor

plugin {
	hyprtasking {
        rows = 3
        exit_behavior = hovered
        gap_size = 8
        bg_color = rgb(000000)
    }
    hyprbars {
        # example config
        bar_height = 32
		bar_part_of_window = true
		bar_buttons_alignment = left
		bar_button_padding = 8
		bar_blur = false
		bar_padding = 10
		bar_text_font = SF Pro
		bar_precedence_over_border = true
		bar_color = rgb(dee0e2)
		col.text = rgb(222222)
		icon_on_hover = true
        hyprbars-button = rgb(fe5154), 16, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(f7c000), 16, , hyprctl dispatch killactive
        hyprbars-button = rgb(2dbf4d), 16, 󰘖, hyprctl dispatch fullscreen 1
        inactive_button_color = rgb(c5c5c5)
        on_double_click = hyprctl dispatch fullscreen 1
    }
    hyprselect {
    	should_round = true
    	col.main = rgba(0085e640)
    	rounding = 10
    	fade_time_ms = 75
    }
	overview {
		workspaceActiveBackground = rgb(EEEEEE)
		workspaceInactiveBorder = 	rgb(FFFFFF)
		workspaceActiveBorder = 	rgb(A0A0A0)
		panelColor = 				rgb(FAFAFA)
		panelBorderColor = 			rgb(A0A0A0)
		exitOnClick =  1
		overrideGaps =  1
		dragAlpha = 0.9
		panelHeight =   180
		panelBorderWidth = 3
		onBottom = 0
		affectStrut = 1
		disableBlur = 1
		disableGestures =  1
		showEmptyWorkspace = 0
		drawActiveWorkspace = 0
		showSpecialWorkspace = 0
		workspaceBorderSize = 1
		reverseSwipe = 0
	}
}
